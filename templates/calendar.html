<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 3508px;
            height: 2480px;
            font-family: 'Roboto', sans-serif;
            background-color: transparent;
            box-sizing: border-box;
        }

        .calendar-container {
            width: 100%;
            height: 100%;
            padding: 100px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 8px solid #333;
            padding-bottom: 30px;
        }

        .header h1 {
            font-size: 150px;
            margin: 0;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 10px;
        }

        table {
            width: 100%;
            flex-grow: 1;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            font-size: 70px;
            color: #555;
            padding-bottom: 30px;
            text-transform: uppercase;
        }

        td {
            border: 6px solid #333;
            vertical-align: top;
            padding: 20px;
            position: relative;
        }

        .day-number {
            font-size: 80px;
            font-weight: bold;
            color: #333;
        }

        .other-month {
            background-color: transparent;
        }

        .other-month .day-number {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="header">
            <h1>{{ month_name }} {{ year }}</h1>
        </div>
        <table>
            <thead>
                <tr>
                    {% for day in day_names %}
                        <th>{{ day }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for week in weeks %}
                    <tr>
                        {% for day, in_month in week %}
                            <td class="{{ 'current-month' if in_month else 'other-month' }}">
                                {% if day != 0 %}
                                    <div class="day-number">{{ day }}</div>
                                {% endif %}
                            </td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
